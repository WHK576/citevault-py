name: Bug report
description: 报告 citevault 的缺陷或错误行为
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供可复现的信息；缺少关键信息可能无法定位。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？和预期有什么不同？
      placeholder: 例如：check 返回 quote_missing，但页面里仍然能看到引用片段。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 尽量给出最小命令或清单片段。
      placeholder: |
        1. citevault add --url ... --claim ... --quote ...
        2. citevault check ...
        3. 看到 ...
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: citevault 版本
      description: 运行 `citevault --version`
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python 版本
      description: 运行 `python --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - 其他
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关输出或日志
      description: 请删除 token、内网地址等敏感信息。
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，没有发现重复
          required: true
        - label: 我使用的是最新版本
          required: true
