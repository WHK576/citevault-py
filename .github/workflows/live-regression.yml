name: live-regression

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .citevault
          key: live-citevault-${{ github.run_id }}
          restore-keys: live-citevault-

      - uses: ./
        id: citevault
        continue-on-error: true
        with:
          mode: scan
          manifest: examples/live-regression.yml
          workers: "3"
          delay: "1"
          block-private: "true"
          extras: "[yaml]"

      - name: diagnose
        if: always() && steps.citevault.outcome == 'failure'
        shell: bash
        run: |
          set +e
          citevault --store .citevault scan examples/live-regression.yml --workers 3 --delay 1 --block-private > /tmp/live.txt 2>&1
          {
            echo "### citevault live output"
            echo '```'
            cat /tmp/live.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
