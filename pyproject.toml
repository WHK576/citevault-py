[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "citevault-py"
dynamic = ["version"]
description = "Local-first citation evidence vault: snapshot the source, anchor the quote, re-verify later."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "citevault-py contributors" }]
keywords = ["citations", "evidence", "provenance", "ai", "ci", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/WHK576/citevault-py"
Repository = "https://github.com/WHK576/citevault-py"
Issues = "https://github.com/WHK576/citevault-py/issues"

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
pdf = ["pypdf>=4.0"]
dev = ["ruff>=0.6", "coverage>=7", "build>=1.2"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[project.scripts]
citevault = "citevault.cli:main"

[tool.setuptools]
packages = ["citevault"]

[tool.setuptools.dynamic]
version = { attr = "citevault.__version__" }
